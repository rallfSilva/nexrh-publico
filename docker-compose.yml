# NexRH Público: sobe tudo com "docker compose up -d" (veja o README).
services:
  app:
    build: .
    image: nexrh-publico:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    ports:
      - "${NEXRH_PORTA:-8080}:8080"
    volumes:
      - arquivos:/var/www/html/storage/app
      - logs:/var/www/html/storage/logs
    depends_on:
      db:
        condition: service_healthy

  fila:
    image: nexrh-publico:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      NEXRH_MIGRAR: "false"
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    volumes:
      - arquivos:/var/www/html/storage/app
      - logs:/var/www/html/storage/logs
    depends_on:
      app:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: America/Boa_Vista
    volumes:
      - banco:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  banco:
  arquivos:
  logs:
