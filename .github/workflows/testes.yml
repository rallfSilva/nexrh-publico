name: Testes

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  testes:
    name: Testes automáticos e padrão de código
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nexrh_test
          POSTGRES_USER: nexrh
          POSTGRES_PASSWORD: nexrh
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nexrh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: nexrh
      DB_PASSWORD: nexrh
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, intl, zip, gd, bcmath
          coverage: none
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci && npm run build
      - run: cp .env.example .env && php artisan key:generate
      - name: Padrão de código (Pint)
        run: vendor/bin/pint --test
      - name: Testes
        run: php artisan test

  docker:
    name: Instalação com Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Prepara o .env
        run: |
          cp .env.example .env
          sed -i "s/^DB_PASSWORD=.*/DB_PASSWORD=senha-de-teste-ci/" .env
          sed -i "s|^APP_KEY=.*|APP_KEY=base64:$(openssl rand -base64 32)|" .env
          echo "NEXRH_DEMO=true" >> .env
      - name: Sobe o sistema com um comando
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Confere que responde
        run: |
          curl -fsS http://localhost:8080/up
          curl -fsS http://localhost:8080/login | grep -q "Entrar no sistema"
      - name: Comando de instalação
        run: docker compose exec -T app php artisan nexrh:instalar --orgao-nome="Órgão CI" --orgao-sigla=CI --nome="Admin CI" --email=admin@ci.local --senha=SenhaForte123
      - name: Backup e restauração
        run: |
          ./scripts/backup.sh ./backups
          PASTA=$(ls -d ./backups/nexrh_* | tail -1)
          echo RESTAURAR | ./scripts/restaurar.sh "$PASTA"
          docker compose exec -T db psql -U nexrh -d nexrh -tAc "select count(*) from users where email='admin@ci.local'" | grep -qx 1
      - name: Backup e restauração pelo PowerShell (os scripts do Windows)
        shell: pwsh
        run: |
          ./scripts/backup.ps1 -Destino ./backups-ps
          $pasta = (Get-ChildItem ./backups-ps -Directory -Filter 'nexrh_*' | Sort-Object Name | Select-Object -Last 1).FullName
          docker compose exec -T db psql -U nexrh -d nexrh -c "update users set name='Alterado depois da copia' where email='admin@ci.local'"
          ./scripts/restaurar.ps1 -Pasta $pasta -Confirmar RESTAURAR
          $nome = docker compose exec -T db psql -U nexrh -d nexrh -tAc "select name from users where email='admin@ci.local'"
          if ($nome.Trim() -ne 'Admin CI') { throw "A restauração não voltou o dado da cópia ($nome)." }
          # A cópia do Windows também confere no Linux, e a do Linux restaura pelo PowerShell.
          Push-Location $pasta; sha256sum -c SHA256SUMS; Pop-Location
          $sh = (Get-ChildItem ./backups -Directory -Filter 'nexrh_*' | Select-Object -Last 1).FullName
          ./scripts/restaurar.ps1 -Pasta $sh -Confirmar RESTAURAR
          docker compose exec -T app php artisan about --only=environment
      - name: API responde com chave
        run: |
          CHAVE=$(docker compose exec -T app php artisan nexrh:chave-api CI "Teste do CI" --escopos=unidades,servidores | tail -1)
          curl -fsS -H "Authorization: Bearer $CHAVE" http://localhost:8080/api/v1/unidades | grep -q '"dados"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/v1/unidades)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CHAVE" http://localhost:8080/api/v1/ferias)" = 403
      - name: Registros em caso de falha
        if: failure()
        run: docker compose logs --tail=200
